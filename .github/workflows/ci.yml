name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The suite is split into balanced shards that run in parallel (tests/run_tests.py, which also runs
  # several test processes at once inside each shard). Shards run to completion even if one fails.
  shard:
    name: tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python tests/run_tests.py --shard ${{ matrix.shard }}/4

  # The Rust tools (crates/): the shared client crates and the root helper. `--locked` builds exactly
  # the dependency versions in Cargo.lock.
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p asb-root-exec
      # `rust-version` in Cargo.toml is a claim; build with exactly that compiler so it cannot go stale. (With the
      # locked dependencies the real minimum is 1.88: the ICU crates behind `ureq` need it.)
      - run: rustup toolchain install 1.88 --profile minimal && cargo +1.88 check --workspace --locked
      - uses: actions/upload-artifact@v4
        with:
          name: asb-root-exec-linux-x86_64
          path: target/release/asb-root-exec
          if-no-files-found: error

  # The root helper against REAL root and sudo: a broker, the helper installed root-owned, a sudoers rule and an
  # unprivileged user. It edits /etc and creates a user, which is fine on a runner that is thrown away after the
  # job; the driver refuses to run anywhere that has not said so (ASB_E2E_DISPOSABLE). Locally, use
  # tests/e2e_root_exec/run.sh, which does the same inside a throwaway container.
  root-e2e:
    name: root-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: rustup toolchain install stable --profile minimal
      - run: cargo build --release --locked -p asb-root-exec
      - name: run the helper end to end as root
        run: >
          sudo env "PATH=$PATH" ASB_E2E_DISPOSABLE=1 ASB_E2E_HELPER="$PWD/target/release/asb-root-exec"
          "$(which python)" tests/e2e_root_exec/driver.py

  # Release builds of the `asb` binary, one native build per platform (no cross-compiling: each runner builds and
  # smoke-runs its own binary). Each artifact is a tar.gz with a .sha256 beside it. Windows is not here: the CLI uses
  # Unix sockets, termios and file modes, so it does not build there yet.
  cli-binaries:
    name: asb (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64, runner: ubuntu-latest }
          - { name: linux-arm64, runner: ubuntu-24.04-arm }
          - { name: macos-arm64, runner: macos-latest }
          - { name: macos-amd64, runner: macos-15-intel }
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-cli-${{ matrix.name }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo build --release --locked -p asb-cli
      - name: smoke test
        run: ./target/release/asb help > /dev/null
      - name: package
        run: |
          mkdir -p dist
          tar -C target/release -czf "dist/asb-${{ matrix.name }}.tar.gz" asb
          cd dist && { sha256sum "asb-${{ matrix.name }}.tar.gz" 2>/dev/null || shasum -a 256 "asb-${{ matrix.name }}.tar.gz"; } > "asb-${{ matrix.name }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: asb-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # The existing test-suite, unmodified, against the Rust `asb` (see docs/proposals/rust-cli.md). It fails on a failing
  # test that is not in tests/rust_cli_known_gaps.txt, and on a listed test that now passes, so the list only shrinks.
  rust-cli-parity:
    name: rust-cli-parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: rustup toolchain install stable --profile minimal
      - run: python tools/run_tests_against_rust_cli.py

  # The single check to require in branch protection: it keeps the name "test" and is green only when
  # every shard and the Rust job are.
  test:
    needs: [shard, rust, root-e2e, rust-cli-parity]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.shard.result }}" = "success" || { echo "tests: ${{ needs.shard.result }}"; exit 1; }
          test "${{ needs.rust.result }}" = "success" || { echo "rust: ${{ needs.rust.result }}"; exit 1; }
          test "${{ needs.root-e2e.result }}" = "success" || { echo "root-e2e: ${{ needs.root-e2e.result }}"; exit 1; }
          test "${{ needs.rust-cli-parity.result }}" = "success" || { echo "rust-cli-parity: ${{ needs.rust-cli-parity.result }}"; exit 1; }

  # A pushed v* tag publishes the binaries as a GitHub release (archives + checksums + the rendered Homebrew formula).
  # With the HOMEBREW_TAP_TOKEN secret set (a token that can push to rgregg/homebrew-tap) it also updates the tap, so
  # `brew install rgregg/tap/asb` and `brew upgrade asb` follow each release.
  release:
    name: release
    needs: [test, cli-binaries]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: asb-*
          path: dist
          merge-multiple: true
      - name: render the Homebrew formula
        run: python3 tools/render_homebrew_formula.py "$TAG" dist > dist/asb.rb
      - name: publish the release
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber
      - name: update the Homebrew tap
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/rgregg/homebrew-tap.git" tap
          mkdir -p tap/Formula && cp dist/asb.rb tap/Formula/asb.rb
          cd tap
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/asb.rb
          git diff --cached --quiet || { git commit -m "asb ${TAG}" && git push; }

  image:
    needs: test
    # main and v* tags publish on push; any branch can be built on demand with
    # `gh workflow run ci.yml --ref BRANCH` (tags: sha-<short> and the branch name, no release tag)
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: built
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.built.outputs.time }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
