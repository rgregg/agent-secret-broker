# XcodeGen spec for the ASBApprover menu bar app. The .xcodeproj is generated, never checked in:
#   brew install xcodegen
#   xcodegen --spec macos/ASBApprover/project.yml
#   xcodebuild -project macos/ASBApprover/ASBApprover.xcodeproj -scheme ASBApprover -configuration Release build
#
# The bundle id is the ASB_BUNDLE_ID build setting; override it for your own signed build, for
# example `xcodebuild ... ASB_BUNDLE_ID=com.example.asb-approver DEVELOPMENT_TEAM=ABCDE12345`.
name: ASBApprover
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  ASBApproverKit:
    path: ../ASBApproverKit

targets:
  ASBApprover:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: ASBApproverKit
        product: ASBApproverKit
    settings:
      base:
        ASB_BUNDLE_ID: io.github.rgregg.asb-approver
        PRODUCT_BUNDLE_IDENTIFIER: $(ASB_BUNDLE_ID)
        PRODUCT_NAME: ASBApprover
        GENERATE_INFOPLIST_FILE: NO
        # The app icon (also shown on banners) and the menu bar template image are rendered from
        # assets/logo/ by tools/make_icon.py.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
    info:
      # Generated by xcodegen from these properties (not checked in).
      path: Info.plist
      properties:
        CFBundleDisplayName: ASB Approver
        CFBundleName: ASB Approver
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.utilities
        # A menu bar app: no Dock icon, no main menu.
        LSUIElement: true
        NSHumanReadableCopyright: MIT License
        # ATS permits plain http to local-network hosts; the app itself accepts http:// only for a
        # loopback broker (AppModel.parseBrokerURL), so anything else needs https.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleTypeRole: Viewer
            # The OIDC redirect: asb-approver://callback
            CFBundleURLSchemes:
              - asb-approver

schemes:
  ASBApprover:
    build:
      targets:
        ASBApprover: all
    run:
      config: Debug
    archive:
      config: Release
