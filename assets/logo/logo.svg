<?xml version="1.0" encoding="UTF-8"?>
<!-- The ASB logo: a padlock with a check, on a blue-to-teal tile. One drawing in three files:
       logo.svg         macOS icon grid (824x824 rounded tile in a 1024 canvas, with shadow): the Mac app icon
       logo-square.svg  the same art full-bleed (iOS rounds it itself): the home-screen icon
       glyph.svg        the padlock alone, one colour, check cut out: the menu bar template image
     The dashboard favicon in secret_broker/broker.py (_ICON) is a small hand copy of logo-square.
     Change all four together, then run: python3 tools/make_icon.py -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B6FE0"/>
      <stop offset="1" stop-color="#1E9E9A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B2A4A" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#sheen)"/>
  <g filter="url(#glyphShadow)">
    <path d="M372 470 V385 a140 140 0 0 1 280 0 V470" fill="none" stroke="#FFFFFF" stroke-width="64" stroke-linecap="round"/>
    <rect x="300" y="452" width="424" height="330" rx="64" ry="64" fill="#FFFFFF"/>
  </g>
  <path d="M410 617 L483 690 L620 553" fill="none" stroke="#2A86BE" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
